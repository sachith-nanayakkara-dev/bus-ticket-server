plugins {
    id 'java'
    id 'war'
    id 'application'
}

group = 'org.sachith'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // Embedded Tomcat
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:10.1.18'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.18'

    // Servlet API (required for HttpServlet)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'org.slf4j:slf4j-simple:2.0.12'

    // Unit testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'org.sachith.server.TomcatServer'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'org.sachith.server.TomcatServer'
        )
    }
}

test {
    useJUnitPlatform()
}